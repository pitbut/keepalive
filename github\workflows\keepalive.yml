name: Keep Render apps awake

on:
  schedule:
    # каждые 10 минут (бесплатный Render засыпает после ~15 минут простоя)
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping every URL in urls.txt
        run: |
          set +e
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            case "$url" in \#*) continue ;; esac
            echo "→ $url"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url")
            echo "   HTTP $code"
          done < urls.txt
